[project]
name = "llm-serving-demo"
version = "0.1.0"
description = "MLOps demo: LLM quantization comparison (FP16 vs AWQ) and serving with vLLM"
requires-python = ">=3.11"
dependencies = [
    "openai",
    "rich",
]

[dependency-groups]
dev = [
    "ruff",
    "pyright",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
venvPath = "."
venv = ".venv"
